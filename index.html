<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Moja strona</title>
</head>
<body>
    <button id="start-sensors-btn" style="padding: 10px 20px; font-size: 16px; margin-bottom: 20px;">
        Aktywuj czujniki
    </button>

    <p>A: <span id="alfa">Pobieranie...</span></p>
    <p>β: <span id="beta">Pobieranie...</span></p>
    <p>Γ: <span id="gamma">Pobieranie...</span></p>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js').then(function () {
        console.log('Service worker zainstalowany');
    }).catch(function (err) {
        console.log('Service worker nie zainstalowany, sprawdź błąd:', err);
    });
}
</script>

<script>
    const alfa = document.getElementById('alfa');
    const beta = document.getElementById("beta");
    const gamma = document.getElementById("gamma");
    const btn = document.getElementById("start-sensors-btn"); // Pobranie przycisku

    function startOrientation() {
        window.addEventListener('deviceorientation', (event) => {
            alfa.textContent = event.alpha !== null ? event.alpha.toFixed(1) : 0;
            beta.textContent = event.beta !== null ? event.beta.toFixed(1) : 0;
            gamma.textContent = event.gamma !== null ? event.gamma.toFixed(1) : 0;
        });
    }

    function handleClick() {
        if (typeof DeviceOrientationEvent.requestPermission === "function") { // Zmieniono na sprawdzanie Orientation
            Promise.all([
                DeviceMotionEvent.requestPermission().catch(() => "denied"),
                DeviceOrientationEvent.requestPermission().catch(() => "denied")
            ]).then(([motionPermission, orientationPermission]) => {
                if (motionPermission === "granted" && orientationPermission === "granted") {
                    startOrientation();
                    btn.style.display = 'none';
                } else {
                    alert("Odrzucono dostęp do czujników.");
                }
            }).catch(err => {
                console.error("Błąd podczas prośby o uprawnienia:", err);
            });
        } else {
            startOrientation();
            btn.style.display = 'none';
        }
    }

    btn.addEventListener("click", handleClick);

</script>
</body>
</html>
