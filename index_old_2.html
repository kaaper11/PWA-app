<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Moja strona</title>
</head>
<body>
    <p>Szerokość geograficzna: <span id="szerokosc">Pobieranie...</span></p>
    <p>Długość geograficzna: <span id="dlugosc">Pobieranie...</span></p>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js').then(function () {
        console.log('Service worker zainstalowany');
    }).catch(function (err) {
        console.log('Service worker nie zainstalowany, sprawdź błąd:', err);
    });
}
</script>

<script>
    const szer = document.getElementById('szerokosc');
    const dlug = document.getElementById("dlugosc");

    function getWspolrzedne(position) {
        const latitude = position.coords.latitude;
        const longitude = position.coords.longitude;

        szer.textContent = latitude.toFixed(6);
        dlug.textContent = longitude.toFixed(6);
    }

    function obsugaBledow(error) {
        console.warn(`Błąd lokalizacji (${error.code}): ${error.message}`);
    }

    function startTracking() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(getWspolrzedne, obsugaBledow, {
                enableHighAccuracy: true,
                maximumAge: 0
            });
        } else {
            szer.textContent = "Brak wsparcia dla GPS";
        }
    }

    window.onload = startTracking;
</script>
</body>
</html>
